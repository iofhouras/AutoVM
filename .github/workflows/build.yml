name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every script parses
        shell: pwsh
        run: |
          $failures = 0
          Get-ChildItem src, tests, build -Recurse -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failures++
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failures) { throw "$failures file(s) failed to parse." }

      - name: Check the window definition is well-formed
        shell: pwsh
        run: |
          $document = New-Object System.Xml.XmlDocument
          $document.LoadXml((Get-Content src/AutoVM.App/MainWindow.xaml -Raw))
          Write-Host "MainWindow.xaml parsed: $($document.SelectNodes('//*').Count) elements"

      - name: Run the test suite
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

  installer:
    name: windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '1.0.0-build.{0}' -f $env:GITHUB_RUN_NUMBER
          }
          # Inno Setup wants a plain numeric version in the filename.
          $fileVersion = ($version -split '-')[0]
          "version=$version"         | Out-File $env:GITHUB_OUTPUT -Append
          "fileVersion=$fileVersion" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Building $version"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the launcher and the installer
        shell: pwsh
        run: ./build/Build-Installer.ps1 -Version ${{ steps.version.outputs.fileVersion }}

      - name: Publish a stable filename as well
        shell: pwsh
        run: |
          # The website links to releases/latest/download/AutoVM-Setup.exe, which
          # only resolves if an asset carries that exact name.
          $built = Get-Item "dist/AutoVM-Setup-${{ steps.version.outputs.fileVersion }}.exe"
          Copy-Item $built.FullName 'dist/AutoVM-Setup.exe'
          $hash = (Get-FileHash $built.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($built.Name)" | Set-Content 'dist/SHA256SUMS.txt'
          Write-Host "$($built.Name)  $([math]::Round($built.Length/1MB,1)) MB  sha256 $hash"

      - name: Verify the engine loads on Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module ./dist/staging/AutoVM/AutoVM.psd1 -Force
          $commands = (Get-Command -Module AutoVM).Count
          if ($commands -lt 20) { throw "Only $commands commands were exported." }
          $profile = Get-AutoVMHostProfile
          $guest = Get-AutoVMGuestCatalog -Id kali
          $plan = New-AutoVMPlan -HostProfile $profile -Guest $guest
          Write-Host ("Windows PowerShell 5.1 plan: " + (Format-AutoVMPlanSummary -Plan $plan))

      - name: Run the test suite on Windows
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AutoVM-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/AutoVM-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoVM-Setup-*.exe
            dist/AutoVM-Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## AutoVM ${{ steps.version.outputs.version }}

            **[Download AutoVM-Setup.exe](https://github.com/iofhouras/AutoVM/releases/latest/download/AutoVM-Setup.exe)**
            — or pick `AutoVM-Setup-${{ steps.version.outputs.fileVersion }}.exe` from the assets below.

            Run it, start AutoVM from the Start menu, choose **Kali Linux Virtual Machine**, type the
            login and password you want inside it, and press **Create VM Now!**. AutoVM sizes the
            machine to your device, installs VirtualBox, downloads and verifies the system image,
            installs it unattended, and then hands you a management screen for power, hardware,
            restore points and shared folders.

            Needs Windows 10 or 11 (64-bit), administrator rights, hardware virtualization enabled in
            firmware, and about 45 GB of free disk space.

            `SHA256SUMS.txt` lists the checksum of the versioned installer.
