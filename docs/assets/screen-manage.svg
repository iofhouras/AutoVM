STATUS</text><rect x="22" y="248" width="192" height="58" rx="7" fill="#101830" stroke="#26314f" stroke-width="1" /><text x="36" y="272" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="36" y="290" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">running · 3072 MB · 4 vCPU</text><line x1="22" y1="656" x2="214" y2="656" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="22" y="678" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your other machines</text><text x="22" y="693" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">and your Windows security settings</text><text x="22" y="708" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">alone.</text><text x="22" y="730" fill="#4e5d7c" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">v1.1.0</text><text x="266" y="78" fill="#e8eef9" font-size="25" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">My machines</text><text x="266" y="104" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Start, adjust, snapshot and share files with the machines AutoVM built.</text><rect x="898" y="62" width="92" height="32" rx="6" fill="#18213c" stro