="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Save state</text><rect x="772" y="436" width="96" height="38" rx="6" fill="#3a2028" stroke="#5e2e38" stroke-width="1" /><text x="820.0" y="460" fill="#ffb3a7" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Force off</text><rect x="542" y="482" width="190" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="637.0" y="506" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Open VirtualBox Manager</text><text x="542" y="544" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Shut down asks the guest to close cleanly. Save state freezes it exactly as it is.</text><text x="542" y="560" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Force off is the equivalent of pulling the plug.</text>
</svg>
