<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="920" height="700" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h900 a10,10 0 0 1 10,10 v22 h-920 z" fill="#131b32"/><line x1="0" y1="32" x2="920" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="460.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="920" height="668" rx="0" fill="#0b1020" /><rect x="0" y="32" width="228" height="668" rx="0" fill="#080d1b" /><text x="24" y="76" fill="#e8eef9" font-size="21" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="24" y="94" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><text x="24" y="132" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="132" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Welcome</text><text x="24" y="158" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="158" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">This device</text><text x="24" y="184" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="184" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your account</text><text x="24" y="210" fill="#e8eef9" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">4</text><text x="46" y="210" fill="#e8eef9" font-size="12.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Review</text><text x="24" y="236" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="46" y="236" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Building</text><text x="24" y="262" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="46" y="262" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Ready</text><line x1="24" y1="300" x2="204" y2="300" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="24" y="324" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your machines and</text><text x="24" y="339" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">your security settings alone unless</text><text x="24" y="354" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you tell it otherwise.</text><text x="262" y="80" fill="#e8eef9" font-size="24" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Before anything is installed</text><text x="262" y="106" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">This is what AutoVM will create on this device.</text><rect x="262" y="141" width="624" height="140" rx="8" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="282" y="171" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">SYSTEM</text><text x="282" y="191" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Kali Linux (Light package set)</text><text x="282" y="215" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">MEMORY GIVEN TO THE MACHINE</text><text x="282" y="235" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3072 MB  -  38% of this device</text><text x="282" y="259" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">PROCESSORS</text><text x="282" y="279" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4 of 8 logical cores</text><text x="578.0" y="171" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">DISK</text><text x="578.0" y="191" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">up to 60 GB on drive C:  (grows as needed)</text><text x="578.0" y="215" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">SIGN IN AS</text><text x="578.0" y="235" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Analyst</text><text x="578.0" y="259" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">ESTIMATED TIME</text><text x="578.0" y="279" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">about 60 minutes</text><rect x="262" y="295" width="624" height="34" rx="7" fill="#241e12" stroke="#4b3b1b" stroke-width="1" /><text x="278" y="317" fill="#f0b84e" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">The light desktop package set was chosen automatically to fit this device.</text><rect x="262" y="337" width="624" height="34" rx="7" fill="#241e12" stroke="#4b3b1b" stroke-width="1" /><text x="278" y="359" fill="#f0b84e" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Windows virtualization-based security is active, so the guest runs in a slower mode.</text><rect x="262" y="379" width="624" height="34" rx="7" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="278" y="401" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▸   Remove virtual machines already on this device</text><text x="810" y="401" fill="#6c7da0" font-size="11" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">off</text><text x="262" y="668" fill="#6c7da0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Nothing has been changed on this device yet.</text><rect x="718" y="648" width="168" height="36" rx="6" fill="#3e8bff" /><text x="802" y="671" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Build my machine</text><rect x="596" y="648" width="112" height="36" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" opacity="1" /><text x="652" y="671" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1">Back</text>
</svg>
