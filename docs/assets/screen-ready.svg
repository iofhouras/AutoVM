<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 752" width="1020" height="752" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="1020" height="752" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h1000 a10,10 0 0 1 10,10 v22 h-1020 z" fill="#131b32"/><line x1="0" y1="32" x2="1020" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="510.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="1020" height="720" rx="0" fill="#0b1020" /><rect x="0" y="32" width="236" height="720" rx="0" fill="#080d1b" /><text x="22" y="74" fill="#e8eef9" font-size="22" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="22" y="92" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><rect x="22" y="116" width="192" height="38" rx="6" fill="#1e2c4e" stroke="#3e8bff" stroke-width="1" /><text x="36" y="140" fill="#e8eef9" font-size="13" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+   Create a machine</text><rect x="22" y="162" width="192" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="36" y="186" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▤   My machines</text><text x="22" y="240" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">STATUS</text><rect x="22" y="248" width="192" height="58" rx="7" fill="#101830" stroke="#26314f" stroke-width="1" /><text x="36" y="272" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="36" y="290" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">poweroff · 3072 MB · 4 vCPU</text><line x1="22" y1="656" x2="214" y2="656" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="22" y="678" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your other machines</text><text x="22" y="693" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">and your Windows security settings</text><text x="22" y="708" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">alone.</text><text x="22" y="730" fill="#4e5d7c" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">v1.1.0</text><text x="266" y="78" fill="#e8eef9" font-size="25" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Your machine is ready</text><text x="266" y="104" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Finished in 01:07:44.</text><rect x="266" y="139" width="724" height="485" rx="10" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="286" y="169" fill="#e8eef9" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your Kali Linux virtual machine is ready.</text><text x="286" y="207" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Start it        Press Manage my machine below, or use the AutoVM Control Center</text><text x="286" y="226" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                shortcut on your desktop.</text><text x="286" y="245" fill="#e8eef9" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Sign in as      Analyst  - exactly as typed. Linux logins are case-sensitive.</text><text x="286" y="264" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Password        the one you chose. AutoVM did not keep a copy.</text><text x="286" y="283" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Shut it down    Use Shut down on the management screen.</text><text x="286" y="302" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Undo changes    Restore to first-boot state discards everything saved inside</text><text x="286" y="321" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                the machine since the build.</text><text x="286" y="359" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Memory          3072 MB, about 38% of this device.</text><text x="286" y="378" fill="#f0b84e" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Network         Outbound only. Nothing can reach into the guest, which is why</text><text x="286" y="397" fill="#f0b84e" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                a simple password is acceptable.</text><rect x="794" y="640" width="196" height="40" rx="6" fill="#3e8bff" /><text x="892.0" y="665" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Manage my machine</text><rect x="660" y="640" width="124" height="40" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="722.0" y="665" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Show the log</text><rect x="500" y="640" width="150" height="40" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="575.0" y="665" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Copy these notes</text>
</svg>
