<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="920" height="700" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h900 a10,10 0 0 1 10,10 v22 h-920 z" fill="#131b32"/><line x1="0" y1="32" x2="920" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="460.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="920" height="668" rx="0" fill="#0b1020" /><rect x="0" y="32" width="228" height="668" rx="0" fill="#080d1b" /><text x="24" y="76" fill="#e8eef9" font-size="21" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="24" y="94" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><text x="24" y="132" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="132" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Welcome</text><text x="24" y="158" fill="#e8eef9" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">2</text><text x="46" y="158" fill="#e8eef9" font-size="12.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">This device</text><text x="24" y="184" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">3</text><text x="46" y="184" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your account</text><text x="24" y="210" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">4</text><text x="46" y="210" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Review</text><text x="24" y="236" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="46" y="236" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Building</text><text x="24" y="262" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="46" y="262" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Ready</text><line x1="24" y1="300" x2="204" y2="300" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="24" y="324" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your machines and</text><text x="24" y="339" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">your security settings alone unless</text><text x="24" y="354" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you tell it otherwise.</text><text x="262" y="80" fill="#e8eef9" font-size="24" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">This device</text><text x="262" y="106" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ready, with a trade-off to confirm: G5</text><rect x="262" y="139" width="388" height="420" rx="8" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="278" y="179" fill="#3fd69b" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">✓</text><text x="300" y="179" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Hardware virtualization enabled</text><text x="300" y="194" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">VirtualizationFirmwareEnabled = True</text><text x="278" y="237" fill="#3fd69b" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">✓</text><text x="300" y="237" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Second level address translation</text><text x="300" y="252" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">SLAT = Extended Page Tables</text><text x="278" y="295" fill="#3fd69b" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">✓</text><text x="300" y="295" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Sufficient host memory</text><text x="300" y="310" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">8 GB installed, 6 GB required</text><text x="278" y="353" fill="#3fd69b" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">✓</text><text x="300" y="353" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Free disk space</text><text x="300" y="368" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">best fixed volume has 240 GB free</text><text x="278" y="411" fill="#f0b84e" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">!</text><text x="300" y="411" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Exclusive use of the extensions</text><text x="300" y="426" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">VBS running, Memory Integrity on</text><text x="300" y="442" fill="#f0b84e" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Runs in a slower hosted mode. AutoVM leaves those protections on.</text><text x="278" y="487" fill="#3fd69b" font-size="13" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">✓</text><text x="300" y="487" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Administrator rights</text><text x="300" y="502" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">elevated = True</text><rect x="666" y="139" width="220" height="196" rx="8" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="684" y="169" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">DEVICE</text><text x="684" y="189" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">ThinkPad L14</text><text x="684" y="213" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">MEMORY</text><text x="684" y="233" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8 GB installed</text><text x="684" y="257" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">PROCESSOR</text><text x="684" y="277" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8 logical cores</text><text x="684" y="301" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">FREE SPACE</text><text x="684" y="321" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">240 GB free on C:</text><rect x="666" y="349" width="220" height="34" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="776" y="371" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Check again</text><text x="262" y="668" fill="#6c7da0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">You can continue — the trade-off is recorded in the build report.</text><rect x="718" y="648" width="168" height="36" rx="6" fill="#3e8bff" /><text x="802" y="671" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Continue</text><rect x="596" y="648" width="112" height="36" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" opacity="1" /><text x="652" y="671" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1">Back</text>
</svg>
