<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a78d6" stop-opacity="0.16"/>
    <stop offset="0.55" stop-color="#2a78d6" stop-opacity="0.03"/>
    <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0e1726"/>
    <stop offset="1" stop-color="#2a78d6"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0 L0 0 0 32" fill="none" stroke="#d5dbe6" stroke-width="0.7" opacity="0.5"/>
  </pattern>
  <mask id="gridfade"><rect width="1280" height="400" fill="url(#gf)"/></mask>
  <linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="400" rx="0" fill="#ffffff" />
<rect width="1280" height="400" fill="url(#grid)" mask="url(#gridfade)"/>
<rect width="1280" height="400" fill="url(#hg)"/>
<rect x="0.5" y="0.5" width="1279" height="399" rx="14" fill="none" stroke="#d5dbe6" stroke-width="1" />
<text x="64" y="74" fill="#2a78d6" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">WINDOWS  ·  ONE CLICK  ·  UNATTENDED</text>
<text x="64" y="152" fill="url(#wordmark)" font-size="64" font-weight="800" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" letter-spacing="-0.02em">AutoVM</text>
<text x="64" y="196" fill="#0e1726" font-size="21" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Autonomously creates a virtual machine of your choosing.</text>
<text x="64" y="228" fill="#55627a" font-size="15" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Type the login and password you want inside it. AutoVM measures the</text>
<text x="64" y="250" fill="#55627a" font-size="15" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">device, sizes a machine that fits, and installs it without a single prompt.</text>
<rect x="64" y="286" width="176" height="24" rx="12" fill="#f6f8fc" stroke="#d5dbe6" stroke-width="1" /><text x="75" y="302.32" fill="#55627a" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Sizes itself to your PC</text>
<rect x="248" y="286" width="122" height="24" rx="12" fill="#f6f8fc" stroke="#d5dbe6" stroke-width="1" /><text x="259" y="302.32" fill="#55627a" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Verified images</text>
<rect x="378" y="286" width="196" height="24" rx="12" fill="#f6f8fc" stroke="#d5dbe6" stroke-width="1" /><text x="389" y="302.32" fill="#55627a" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Nothing deleted by default</text>
<text x="64" y="344" fill="#0e1726" font-size="15" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">30–90 min</text>
<text x="150" y="344" fill="#8592ab" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">mostly unattended</text>
<line x1="260" y1="330" x2="260" y2="350" stroke="#d5dbe6" stroke-width="1" stroke-linecap="butt"/>
<text x="280" y="344" fill="#0e1726" font-size="15" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">~45 GB</text>
<text x="350" y="344" fill="#8592ab" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">free disk</text>
<line x1="414" y1="330" x2="414" y2="350" stroke="#d5dbe6" stroke-width="1" stroke-linecap="butt"/>
<text x="434" y="344" fill="#0e1726" font-size="15" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">0</text>
<text x="446" y="344" fill="#8592ab" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">installer questions</text>
<rect x="720" y="62" width="496" height="88" rx="12" fill="#f6f8fc" stroke="#d5dbe6" stroke-width="1" />
<rect x="720" y="76" width="3" height="60" rx="2" fill="#55627a" />
<text x="742" y="90" fill="#55627a" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">THIS DEVICE</text>
<text x="742" y="120" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8 GB</text>
<text x="742" y="138" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">memory</text>
<text x="902" y="120" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">8 cores</text>
<text x="902" y="138" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">processor</text>
<text x="1062" y="120" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">240 GB</text>
<text x="1062" y="138" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">free</text>
<line x1="968.0" y1="152" x2="968.0" y2="165" stroke="#8592ab" stroke-width="1.4" stroke-linecap="butt"/><path d="M963.5,164 L968.0,171 L972.5,164 Z" fill="#8592ab"/>
<rect x="720" y="174" width="496" height="88" rx="12" fill="#e8f0fd" stroke="#b9d3f5" stroke-width="1" />
<rect x="720" y="188" width="3" height="60" rx="2" fill="#2a78d6" />
<text x="742" y="202" fill="#2a78d6" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">AUTOVM PLANS IT</text>
<text x="742" y="232" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3072 MB</text>
<text x="742" y="250" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">38% of host</text>
<text x="902" y="232" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4 vCPU</text>
<text x="902" y="250" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">half the cores</text>
<text x="1062" y="232" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">60 GB</text>
<text x="1062" y="250" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">on C:</text>
<line x1="968.0" y1="264" x2="968.0" y2="277" stroke="#8592ab" stroke-width="1.4" stroke-linecap="butt"/><path d="M963.5,276 L968.0,283 L972.5,276 Z" fill="#8592ab"/>
<rect x="720" y="286" width="496" height="88" rx="12" fill="#f6f8fc" stroke="#d5dbe6" stroke-width="1" />
<rect x="720" y="300" width="3" height="60" rx="2" fill="#0a7c52" />
<text x="742" y="314" fill="#0a7c52" font-size="10.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">YOUR MACHINE</text>
<text x="742" y="344" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Kali Linux</text>
<text x="742" y="362" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">running</text>
<text x="902" y="344" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Analyst</text>
<text x="902" y="362" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">sign in as</text>
<text x="1062" y="344" fill="#0e1726" font-size="19" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Snapshot</text>
<text x="1062" y="362" fill="#8592ab" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">restore point taken</text>
</svg>
