<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="920" height="700" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h900 a10,10 0 0 1 10,10 v22 h-920 z" fill="#131b32"/><line x1="0" y1="32" x2="920" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="460.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="920" height="668" rx="0" fill="#0b1020" /><rect x="0" y="32" width="228" height="668" rx="0" fill="#080d1b" /><text x="24" y="76" fill="#e8eef9" font-size="21" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="24" y="94" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><text x="24" y="132" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="132" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Welcome</text><text x="24" y="158" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="158" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">This device</text><text x="24" y="184" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="184" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your account</text><text x="24" y="210" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="210" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Review</text><text x="24" y="236" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="236" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Building</text><text x="24" y="262" fill="#e8eef9" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="46" y="262" fill="#e8eef9" font-size="12.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Ready</text><line x1="24" y1="300" x2="204" y2="300" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="24" y="324" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your machines and</text><text x="24" y="339" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">your security settings alone unless</text><text x="24" y="354" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you tell it otherwise.</text><text x="262" y="80" fill="#e8eef9" font-size="24" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Your machine is ready</text><text x="262" y="106" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Finished in 01:07:44.</text><rect x="262" y="141" width="404" height="300" rx="8" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="282" y="169" fill="#e8eef9" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your Kali Linux virtual machine is ready.</text><text x="282" y="205" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Start it        Double-click 'AutoVM Control Center' on your</text><text x="282" y="223" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                desktop, then Start (Window).</text><text x="282" y="241" fill="#e8eef9" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Sign in as      Analyst  - exactly as typed. Linux logins are</text><text x="282" y="259" fill="#e8eef9" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                case-sensitive.</text><text x="282" y="277" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Password        the one you chose. AutoVM did not keep a copy.</text><text x="282" y="295" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Shut it down    Use Shut Down in the control panel.</text><text x="282" y="313" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Undo changes    Restore to first-boot state discards everything</text><text x="282" y="331" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                saved inside the machine since the build.</text><text x="282" y="367" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Memory          3072 MB, about 38% of this device.</text><text x="282" y="385" fill="#f0b84e" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Network         Outbound only. Nothing can reach into the guest,</text><text x="282" y="403" fill="#f0b84e" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">                which is why a simple password is acceptable.</text><rect x="682" y="141" width="204" height="38" rx="6" fill="#3e8bff" /><text x="784" y="165" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Open the control panel</text><rect x="682" y="189" width="204" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="784" y="213" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Show the build log</text><rect x="682" y="237" width="204" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="784" y="261" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Copy these notes</text><rect x="718" y="648" width="168" height="36" rx="6" fill="#3e8bff" /><text x="802" y="671" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Finish</text><rect x="596" y="648" width="112" height="36" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" opacity="0.4" /><text x="652" y="671" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="0.4">Back</text>
</svg>
