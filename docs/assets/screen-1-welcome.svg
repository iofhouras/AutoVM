<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="920" height="700" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h900 a10,10 0 0 1 10,10 v22 h-920 z" fill="#131b32"/><line x1="0" y1="32" x2="920" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="460.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="920" height="668" rx="0" fill="#0b1020" /><rect x="0" y="32" width="228" height="668" rx="0" fill="#080d1b" /><text x="24" y="76" fill="#e8eef9" font-size="21" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="24" y="94" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><text x="24" y="132" fill="#e8eef9" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">1</text><text x="46" y="132" fill="#e8eef9" font-size="12.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Welcome</text><text x="24" y="158" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">2</text><text x="46" y="158" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">This device</text><text x="24" y="184" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">3</text><text x="46" y="184" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your account</text><text x="24" y="210" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">4</text><text x="46" y="210" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Review</text><text x="24" y="236" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="46" y="236" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Building</text><text x="24" y="262" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="46" y="262" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Ready</text><line x1="24" y1="300" x2="204" y2="300" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="24" y="324" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your machines and</text><text x="24" y="339" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">your security settings alone unless</text><text x="24" y="354" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you tell it otherwise.</text><text x="262" y="80" fill="#e8eef9" font-size="24" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Set up a Linux virtual machine</text><text x="262" y="106" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM looks at this computer, works out a machine that will run well on it,</text><text x="262" y="125" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">downloads a verified system image, and installs it without you having to answer</text><text x="262" y="144" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">installer questions. You choose the login and password; everything else is decided.</text><rect x="262" y="181" width="624" height="132" rx="8" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="282" y="209" fill="#e8eef9" font-size="13.5" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">What happens next</text><text x="282" y="235" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1.  AutoVM checks that this computer can run a virtual machine at all.</text><text x="282" y="256" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">2.  You pick the system and type the login and password you want inside it.</text><text x="282" y="277" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3.  You see exactly what will be created before anything is installed.</text><text x="282" y="298" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4.  AutoVM builds it and puts a control panel on your desktop.</text><rect x="262" y="329" width="624" height="76" rx="8" fill="#1b2038" stroke="#3a3050" stroke-width="1" /><text x="280" y="357" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM needs administrator rights to install the virtualization software, and it</text><text x="280" y="376" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">downloads several gigabytes. It will not change your firewall, your Windows security</text><text x="280" y="395" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">settings, or any virtual machine you already have.</text><rect x="718" y="648" width="168" height="36" rx="6" fill="#3e8bff" /><text x="802" y="671" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Get started</text><rect x="596" y="648" width="112" height="36" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" opacity="0.4" /><text x="652" y="671" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="0.4">Back</text>
</svg>
