<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 752" width="1020" height="752" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="1020" height="752" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h1000 a10,10 0 0 1 10,10 v22 h-1020 z" fill="#131b32"/><line x1="0" y1="32" x2="1020" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="510.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="1020" height="720" rx="0" fill="#0b1020" /><rect x="0" y="32" width="236" height="720" rx="0" fill="#080d1b" /><text x="22" y="74" fill="#e8eef9" font-size="22" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="22" y="92" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><rect x="22" y="116" width="192" height="38" rx="6" fill="#1e2c4e" stroke="#3e8bff" stroke-width="1" /><text x="36" y="140" fill="#e8eef9" font-size="13" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+   Create a machine</text><rect x="22" y="162" width="192" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="36" y="186" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▤   My machines</text><text x="22" y="240" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">STATUS</text><rect x="22" y="248" width="192" height="58" rx="7" fill="#101830" stroke="#26314f" stroke-width="1" /><text x="36" y="272" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">No machine yet</text><text x="36" y="290" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Create one from the first screen.</text><line x1="22" y1="656" x2="214" y2="656" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="22" y="678" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your other machines</text><text x="22" y="693" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">and your Windows security settings</text><text x="22" y="708" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">alone.</text><text x="22" y="730" fill="#4e5d7c" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">v1.1.0</text><text x="266" y="78" fill="#e8eef9" font-size="25" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Create a virtual machine</text><text x="266" y="104" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Pick a system, choose the login you want inside it, and press the button. AutoVM handles</text><text x="266" y="123" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">the rest — the hypervisor, the download, the installation and the setup.</text><text x="266" y="160" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">CHOOSE A SYSTEM</text><rect x="266.0" y="172" width="355.0" height="92" rx="10" fill="#16233f" stroke="#3e8bff" stroke-width="2" /><circle cx="290.0" cy="198" r="6" fill="#3e8bff"/><text x="306.0" y="203" fill="#e8eef9" font-size="15" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Kali Linux Virtual Machine</text><text x="306.0" y="224" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Security distribution with the Xfce desktop. The usual choice.</text><text x="306.0" y="242" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">about 60 minutes · ~4 GB download</text><rect x="635.0" y="172" width="355.0" height="92" rx="10" fill="#131b32" stroke="#26314f" stroke-width="2" /><circle cx="659.0" cy="198" r="6" fill="#33405e"/><text x="675.0" y="203" fill="#e8eef9" font-size="15" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Debian Virtual Machine</text><text x="675.0" y="224" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Plain Debian with a desktop. Smaller and quicker to install.</text><text x="675.0" y="242" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">about 30 minutes · ~0.7 GB download</text><text x="266" y="280" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">YOUR LOGIN INSIDE THE MACHINE</text><text x="266" y="302" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Username</text><rect x="266" y="310" width="355.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="277" y="332" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Analyst</text><text x="266" y="364" fill="#f0b84e" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">You will sign in as 'Analyst'. Created as 'analyst', renamed after install.</text><text x="635.0" y="302" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Machine name (optional)</text><rect x="635.0" y="310" width="355.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="646.0" y="332" fill="#6c7da0" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="635.0" y="364" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">How it is listed in VirtualBox.</text><text x="266" y="384" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Password</text><rect x="266" y="392" width="355.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="277" y="414" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">••••••••••••</text><rect x="266" y="434" width="355.0" height="5" rx="3" fill="#0e1730" /><rect x="266" y="434" width="284.0" height="5" rx="3" fill="#3fd69b" /><text x="266" y="456" fill="#3fd69b" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Strength: strong.</text><text x="635.0" y="384" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Confirm password</text><rect x="635.0" y="392" width="355.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="646.0" y="414" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">••••••••••••</text><rect x="266" y="476" width="724" height="46" rx="8" fill="#1b2038" stroke="#3a3050" stroke-width="1" /><text x="282" y="496" fill="#93a3c0" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Linux logins are case-sensitive — you will sign in with exactly what you type here.</text><text x="282" y="512" fill="#93a3c0" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM never stores your password; it goes straight into the installation and is then erased.</text><text x="266" y="548" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▸  What AutoVM found on this device</text><rect x="266" y="636" width="724" height="84" rx="10" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="284" y="670" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM will build Kali Linux with 3072 MB of memory, 4 processors</text><text x="284" y="688" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">and up to 60 GB of disk on drive C:.</text><text x="284" y="706" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">About 60 minutes. That is 38% of this computer's memory, so the rest stays yours.</text><rect x="764" y="654" width="208" height="48" rx="6" fill="#3e8bff" /><text x="868.0" y="684" fill="#ffffff" font-size="15.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Create VM Now!</text>
</svg>
