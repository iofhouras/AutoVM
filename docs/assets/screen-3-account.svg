<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="920" height="700" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="920" height="700" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h900 a10,10 0 0 1 10,10 v22 h-920 z" fill="#131b32"/><line x1="0" y1="32" x2="920" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="460.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="920" height="668" rx="0" fill="#0b1020" /><rect x="0" y="32" width="228" height="668" rx="0" fill="#080d1b" /><text x="24" y="76" fill="#e8eef9" font-size="21" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="24" y="94" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><text x="24" y="132" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="132" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Welcome</text><text x="24" y="158" fill="#3fd69b" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">✓</text><text x="46" y="158" fill="#3fd69b" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">This device</text><text x="24" y="184" fill="#e8eef9" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">3</text><text x="46" y="184" fill="#e8eef9" font-size="12.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Your account</text><text x="24" y="210" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">4</text><text x="46" y="210" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Review</text><text x="24" y="236" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="46" y="236" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Building</text><text x="24" y="262" fill="#93a3c0" font-size="12" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="46" y="262" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Ready</text><line x1="24" y1="300" x2="204" y2="300" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="24" y="324" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your machines and</text><text x="24" y="339" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">your security settings alone unless</text><text x="24" y="354" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you tell it otherwise.</text><text x="262" y="80" fill="#e8eef9" font-size="24" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Your account inside the machine</text><text x="262" y="106" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">This is the login you will use every time you start the virtual machine.</text><text x="262" y="125" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM does not store the password anywhere.</text><text x="262" y="160" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">SYSTEM</text><circle cx="269" cy="182" r="7" fill="none" stroke="#3e8bff" stroke-width="1.6"/><circle cx="269" cy="182" r="3.4" fill="#3e8bff"/><text x="284" y="186" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Kali Linux</text><circle cx="394" cy="182" r="7" fill="none" stroke="#93a3c0" stroke-width="1.6"/><text x="409" y="186" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Debian</text><text x="262" y="210" fill="#93a3c0" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Debian-derived security distribution with the Xfce desktop  -  about 60 minutes to install.</text><text x="262" y="236" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">LOGIN NAME</text><rect x="262" y="244" width="299.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="273" y="266" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Analyst</text><text x="262" y="296" fill="#f0b84e" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Created as 'analyst', renamed to 'Analyst' after install.</text><text x="587.0" y="236" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">MACHINE NAME (OPTIONAL)</text><rect x="587.0" y="244" width="299.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="598.0" y="266" fill="#6c7da0" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="587.0" y="296" fill="#93a3c0" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">How the machine is listed in VirtualBox.</text><text x="262" y="328" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">PASSWORD</text><rect x="262" y="336" width="299.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="273" y="358" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">••••••••••••</text><rect x="262" y="378" width="299.0" height="5" rx="3" fill="#0e1730" /><rect x="262" y="378" width="239.20000000000002" height="5" rx="3" fill="#3fd69b" /><text x="262" y="402" fill="#3fd69b" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Strength: strong.</text><text x="587.0" y="328" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">CONFIRM PASSWORD</text><rect x="587.0" y="336" width="299.0" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="598.0" y="358" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">••••••••••••</text><rect x="262" y="434" width="624" height="52" rx="8" fill="#1b2038" stroke="#3a3050" stroke-width="1" /><text x="280" y="456" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Linux logins are case-sensitive. Whatever you type here is exactly what</text><text x="280" y="474" fill="#93a3c0" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">you will type to sign in.</text><rect x="718" y="648" width="168" height="36" rx="6" fill="#3e8bff" /><text x="802" y="671" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Continue</text><rect x="596" y="648" width="112" height="36" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" opacity="1" /><text x="652" y="671" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" opacity="1">Back</text>
</svg>
