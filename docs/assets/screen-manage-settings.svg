<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 752" width="1020" height="752" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

<rect x="0" y="0" width="1020" height="752" rx="10" fill="#0b1020" stroke="#26314f" stroke-width="1" /><path d="M0,10 a10,10 0 0 1 10,-10 h1000 a10,10 0 0 1 10,10 v22 h-1020 z" fill="#131b32"/><line x1="0" y1="32" x2="1020" y2="32" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="33" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/><text x="510.0" y="21" fill="#93a3c0" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><rect x="0" y="32" width="1020" height="720" rx="0" fill="#0b1020" /><rect x="0" y="32" width="236" height="720" rx="0" fill="#080d1b" /><text x="22" y="74" fill="#e8eef9" font-size="22" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM</text><text x="22" y="92" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">virtual machines, set up for you</text><rect x="22" y="116" width="192" height="38" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="36" y="140" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+   Create a machine</text><rect x="22" y="162" width="192" height="38" rx="6" fill="#1e2c4e" stroke="#3e8bff" stroke-width="1" /><text x="36" y="186" fill="#e8eef9" font-size="13" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▤   My machines</text><text x="22" y="240" fill="#93a3c0" font-size="10" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">STATUS</text><rect x="22" y="248" width="192" height="58" rx="7" fill="#101830" stroke="#26314f" stroke-width="1" /><text x="36" y="272" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="36" y="290" fill="#93a3c0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">poweroff · 3072 MB · 4 vCPU</text><line x1="22" y1="656" x2="214" y2="656" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><text x="22" y="678" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM leaves your other machines</text><text x="22" y="693" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">and your Windows security settings</text><text x="22" y="708" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">alone.</text><text x="22" y="730" fill="#4e5d7c" font-size="10" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">v1.1.0</text><text x="266" y="78" fill="#e8eef9" font-size="25" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">My machines</text><text x="266" y="104" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Start, adjust, snapshot and share files with the machines AutoVM built.</text><rect x="898" y="62" width="92" height="32" rx="6" fill="#18213c" stroke="#26314f" stroke-width="1" /><text x="944" y="83" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Refresh</text><rect x="266" y="140" width="242" height="572" rx="10" fill="#131b32" stroke="#26314f" stroke-width="1" /><rect x="274" y="148" width="226" height="44" rx="6" fill="#1b2743" /><circle cx="290" cy="170" r="4.5" fill="#ff6b5e"/><text x="304" y="166" fill="#e8eef9" font-size="13" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">AutoVM-kali</text><text x="304" y="182" fill="#6c7da0" font-size="10.5" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">poweroff · 3072 MB · 4 vCPU</text><text x="568.4" y="162" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Overview</text><text x="657.1999999999999" y="162" fill="#e8eef9" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Settings</text><rect x="612.8" y="172" width="88.8" height="2" rx="0" fill="#3e8bff" /><text x="768.8" y="162" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Restore points</text><text x="895.5999999999999" y="162" fill="#93a3c0" font-size="13" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Files &amp; data</text><line x1="524" y1="173" x2="990" y2="173" stroke="#26314f" stroke-width="1" stroke-linecap="butt"/><rect x="524" y="188" width="466" height="200" rx="10" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="544.0" y="216" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">MEMORY (MB)</text><rect x="544.0" y="224" width="131.33333333333334" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="555.0" y="246" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3072</text><text x="544.0" y="274" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1024 – 4096 on this device</text><text x="691.3333333333334" y="216" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">PROCESSORS</text><rect x="691.3333333333334" y="224" width="131.33333333333334" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="702.3333333333334" y="246" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4</text><text x="691.3333333333334" y="274" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1 – 8 on this device</text><text x="838.6666666666667" y="216" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">VIDEO MEMORY (MB)</text><rect x="838.6666666666667" y="224" width="131.33333333333334" height="34" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="849.6666666666667" y="246" fill="#e8eef9" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">128</text><text x="838.6666666666667" y="274" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">16 – 256</text><text x="544" y="304" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">SHARED CLIPBOARD</text><rect x="544" y="312" width="260" height="32" rx="5" fill="#0e1730" stroke="#26314f" stroke-width="1" /><text x="556" y="333" fill="#e8eef9" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Both directions</text><text x="820" y="333" fill="#93a3c0" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">▾</text><text x="544" y="358" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">The clipboard is a path between Windows and the machine.</text><text x="544" y="373" fill="#93a3c0" font-size="11" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Turn it off if the machine will handle anything untrusted.</text><rect x="524" y="404" width="150" height="40" rx="6" fill="#3e8bff" /><text x="599" y="429" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Apply changes</text><text x="688" y="429" fill="#3fd69b" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Saved.</text><rect x="524" y="462" width="466" height="116" rx="10" fill="#131b32" stroke="#26314f" stroke-width="1" /><text x="542" y="488" fill="#93a3c0" font-size="9.5" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" letter-spacing="0.14em">NETWORK</text><text x="542" y="510" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">This machine reaches out through your connection, and</text><text x="542" y="527" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">nothing on your network can reach into it. AutoVM does not</text><text x="542" y="544" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">offer bridged networking or port forwarding, because that is</text><text x="542" y="561" fill="#e8eef9" font-size="12.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">what makes a simple guest password safe.</text>
</svg>
